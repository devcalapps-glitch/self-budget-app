<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5850"/>
      <stop offset="100%" stop-color="#123A33"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#badgeGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#sheen)"/>

  <!-- ascending savings bars -->
  <rect x="168" y="301" width="48" height="92"  rx="24" fill="#9FC4B6"/>
  <rect x="232" y="251" width="48" height="142" rx="24" fill="#D9A855"/>
  <rect x="296" y="193" width="48" height="200" rx="24" fill="#F5EFE2"/>

  <!-- coin accent with "on track" check -->
  <circle cx="320" cy="151" r="32" fill="#F5EFE2" stroke="#D9A855" stroke-width="6"/>
  <path d="M308 155 L320 141 L332 155" fill="none" stroke="#1F5850" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
